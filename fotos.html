<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto's — Buurtraad Geerstraat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<style>
  .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .album-kaart { background: #fff; border-radius: var(--r); padding: 26px; box-shadow: var(--shadow); border: 1px solid rgba(53,42,24,.05); display: flex; flex-direction: column; gap: 14px; transition: transform .15s; }
  .album-kaart:hover { transform: translateY(-3px); }
  .album-icoon { width: 52px; height: 52px; border-radius: 14px; background: var(--leaf-soft); display: grid; place-items: center; color: var(--green); flex: none; }
  .album-icoon svg { width: 28px; height: 28px; }
  .album-kaart h3 { font-family: 'Newsreader', Georgia, serif; font-size: 1.2rem; color: var(--green-deep); line-height: 1.2; }
  .album-link { display: inline-flex; align-items: center; gap: 8px; background: var(--green); color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: .93rem; transition: background .15s, transform .15s; align-self: flex-start; }
  .album-link:hover { background: var(--green-deep); transform: translateY(-1px); }
  .album-leeg { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-style: italic; font-family: 'Newsreader', serif; font-size: 1.1rem; grid-column: 1/-1; }
</style>
</head>
<body>

<div id="header-container"></div>

<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Herinneringen</span>
      <h1>Foto's</h1>
      <p>Bekijk de foto-albums van onze activiteiten en evenementen.</p>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="album-grid" id="albumGrid">
        <p style="color:var(--ink-soft);font-style:italic;">Albums laden&hellip;</p>
      </div>
    </div>
  </section>
</main>

<div id="footer-container"></div>
<script src="assets/common.js"></script>
<script>
const fotoIcoon = '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>';

fetch('data/fotos.json').then(r => r.json()).then(albums => {
  const grid = document.getElementById('albumGrid');
  if (!albums.length) {
    grid.innerHTML = '<p class="album-leeg">Er zijn nog geen fotoalbums toegevoegd.</p>';
    return;
  }
  grid.innerHTML = albums.map(a =>
    `<div class="album-kaart">
      <div class="album-icoon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${fotoIcoon}</svg>
      </div>
      <h3>${a.naam}</h3>
      <a class="album-link" href="${a.url}" target="_blank" rel="noopener">
        Bekijk album
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>`
  ).join('');
}).catch(() => {
  document.getElementById('albumGrid').innerHTML = '<p class="album-leeg">Albums tijdelijk niet beschikbaar.</p>';
});
</script>
</body>
</html>
